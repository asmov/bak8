[package]
name = "bak8-bak"
version = "1.0.1"
description = "Creates a backup .bak copy of a file"
authors = ["Asmov LLC <development.pub@asmov.software>"]
repository = "https://github.com/asmov/bak8"
homepage = "https://github.com/asmov/bak8/tree/dev/packages/bak8-bak"
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities", "filesystem"]
keywords = ["bak", "bak8", "backup", "copy"]
edition = "2024"

[[bin]]
name = "bak"
path = "src/main.rs"

[dependencies]
sourcetrait_lib_backup_os = { version="0", path = "../sourcetrait_lib_backup_os" }
clap = { version = "4", features = ["derive"] }
colored = "3"
file_diff = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
function_name = "0.3"
file_diff = "1"

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/bak", dest = "/usr/bin/bak", mode = "755" }
]
