[package]
name = "sourcetrait_lib_bak"
version = "1.0.1"
description = "Creates a backup .bak copy of a file"
authors = ["SourceTrait <development@sourcetrait.com>"]
repository = "https://github.com/sourcetrait/sourcetrait_cli"
homepage = "https://sourcetrait.com"
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities", "filesystem"]
keywords = ["sourcetrait", "bak", "backup", "copy"]
edition = "2024"

[[bin]]
name = "bak"
path = "src/main.rs"

[dependencies]
sourcetrait_crossplat.workspace = true
clap.workspace = true
colored.workspace = true
file_diff.workspace = true
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
function_name.workspace = true
file_diff.workspace = true

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/bak", dest = "/usr/bin/bak", mode = "755" }
]
