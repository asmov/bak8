[package]
name = "sourcetrait_lib_backup"
version = "0.1.0"
description = "Rotational backup system for workstation users"
authors = ["Asmov LLC <development.pub@asmov.software>"]
repository = "https://github.com/asmov/bak8"
homepage = "https://github.com/asmov/bak8/tree/dev/packages/bak8"
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities", "filesystem"]
keywords = ["sourcetrait", "lib", "backup", "copy"]
edition = "2024"

[dependencies]
sourcetrait_lib_backup_os = { version="0", path = "../sourcetrait_lib_backup_os" }
chrono = "0.4"
cron = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
validator = { version = "0.20", features = ["derive"] }
shellexpand = "3"
colored = "3"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
whoami = "2.0.0-pre.2"
strum = { version = "0.27", features = ["derive"] }
strip-ansi-escapes = "0.2"
semver = "1"
sha256 = "1"
uzers = "0.12"

[dev-dependencies]
sourcetrait_testing = "4"
lazy_static = "1"
dir-diff = "0.3"
regex = "1"
