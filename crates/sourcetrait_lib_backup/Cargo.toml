[package]
name = "sourcetrait_lib_backup"
version = "0.1.0"
description = "Rotational backup system for workstation users"
authors = ["SourceTrait <development@sourcetrait.com>"]
repository = "https://github.com/sourcetrait/sourcetrait_lib"
homepage = "https://sourcetrait.com"
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities", "filesystem"]
